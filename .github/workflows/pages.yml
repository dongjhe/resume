name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and asset versions
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          if [ -d demos ]; then cp -R demos _site/; fi
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          page = Path('_site/index.html')
          html = page.read_text()
          def version(match):
              path = match.group(1)
              file = Path('_site') / path
              if not file.is_file():
                  return match.group(0)
              digest = hashlib.sha256(file.read_bytes()).hexdigest()[:12]
              return path + '?v=' + digest
          html = re.sub(r'(assets/[\w./-]+\.(?:webp|png|jpg|jpeg|svg|css|js))(?:\?v=[\w-]+)?', version, html)
          page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -qE '^[0-9]+        id: deployment
        uses: actions/deploy-pages@v4
; then
              echo "Pages artifact is visible."
              exit 0
            fi
            echo "Waiting for artifact metadata ($attempt/18)"
            sleep 10
          done
          echo "::error::Pages artifact metadata did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
