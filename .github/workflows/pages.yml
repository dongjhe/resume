name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and asset versions
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          page = Path('_site/index.html')
          html = page.read_text()
          def version(match):
              path = match.group(1)
              file = Path('_site') / path
              if not file.is_file():
                  return match.group(0)
              digest = hashlib.sha256(file.read_bytes()).hexdigest()[:12]
              return path + '?v=' + digest
          html = re.sub(r'(assets/[\w./-]+\.(?:webp|png|jpg|jpeg|svg|css|js))(?:\?v=[\w-]+)?', version, html)
          page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
